# gitleaks (`just secrets`). CodeSynapse detects secrets, so its tests and
# rule examples contain fake ones on purpose; those paths are allowed.
# Everything else, including docs and workflows, is scanned.
[extend]
useDefault = true

[[allowlists]]
description = "fake secrets in tests, fixtures and rule examples"
paths = [
  '''(^|/)testdata/''',
  '''_test\.go$''',
  # Shared contract-test packages (accountstest, storetest, ssotest, ...).
  '''(^|/)[a-z]+test/[^/]+\.go$''',
  '''^rules/(code|config)/[^/]+\.yaml$''',
]

# NebulaGraph's graphd flags (--auth_type=password, --enable_authorize=true)
# read as a generic API key; no credential is in the line.
[[allowlists]]
description = "graphd command line in docker-compose.yml"
condition = "AND"
paths = ['''^docker-compose\.yml$''']
regexTarget = "line"
regexes = ['''--auth_type=password''']
