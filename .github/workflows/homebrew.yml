name: Homebrew formula

# Installs the formula the release would push to astrona-io/homebrew-tap,
# built from this commit, with real Homebrew on macOS and Linux, so a broken
# formula is caught on its PR, not at release time. Only runs when something
# the formula depends on changes (it runs `codesynapse completion` and
# `codesynapse mcp bridge` at install and test time).
on:
  pull_request:
    paths:
      - '.github/scripts/homebrew-formula.sh'
      - '.github/scripts/test-homebrew-formula.sh'
      - '.github/workflows/homebrew.yml'
      - '.github/workflows/release.yml'
      - 'cmd/codesynapse/**'
      - 'go.mod'

concurrency:
  group: homebrew-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formula:
    name: Formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # Preinstalled on GitHub's macOS and Ubuntu runners; on Ubuntu it just
      # isn't on PATH.
      - name: Put Homebrew on PATH
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
            echo /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"
          fi

      - name: Style, audit, install and test the formula
        run: .github/scripts/test-homebrew-formula.sh
