name: PostgreSQL image

# The PostgreSQL image of the chart and docker-compose (deploy/postgres): the
# official image with gosu rebuilt on our Go version, so scans (Artifact Hub,
# Trivy) stop reporting the Go standard library bundled in upstream's gosu.
# Pull requests build and scan only. A merge to main and a weekly rebuild
# publish a floating tag (the official image moves the same way) and sign it,
# so Alpine fixes reach us within a week without a release.
#   :18-alpine            moves with each rebuild
#   :18-alpine-YYYYMMDD   that rebuild
on:
  pull_request:
    paths:
      - 'deploy/postgres/**'
      - '.trivyignore'
      - 'justfile'
      - '.github/workflows/postgres-image.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/postgres/**'
      - '.github/workflows/postgres-image.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          file: deploy/postgres/Dockerfile
          platforms: linux/amd64
          load: true
          tags: codesynapse-postgres:scan
      - name: Fixable HIGH and CRITICAL vulnerabilities (Trivy)
        run: just scan-image codesynapse-postgres:scan

  publish:
    name: Publish
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign keyless signing and build attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/codesynapse-postgres
          flavor: latest=false
          tags: |
            type=raw,value=18-alpine
            type=raw,value=18-alpine-{{date 'YYYYMMDD'}}
      - id: build
        name: Build and push (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          file: deploy/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/codesynapse-postgres
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
