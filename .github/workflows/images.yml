name: Images

# Container images for api, worker, mcp and web (docs/SAAS.md, 5d and 5e),
# and on a release the Helm chart (6b): published next to the images,
# installed from the registry on a throwaway kind cluster with the published
# images, and only then marked as the latest release.
# Pull requests and merges to main build and scan only. Images are published
# only by a release: a vX.Y.Z or vX.Y.Z-rcN tag on a commit that is on main.
# They go to ghcr.io multi-arch with SBOM and provenance, signed with cosign
# (keyless). Pull requests never get write permissions.
#   v1.3.0-rc1:  :1.3.0-rc1
#   v1.3.0:      :1.3.0, :1.3, :latest
on:
  pull_request:
    paths:
      - 'services/**'
      - 'cmd/**'
      - 'internal/**'
      - 'rules/**'
      - 'go.mod'
      - 'go.sum'
      - '.trivyignore'
      - 'justfile'
      - '.github/workflows/images.yml'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Build and scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, mcp, web]
        # worker is a target of the API's Dockerfile (docs/SAAS.md, 5e).
        include:
          - {service: api, dockerfile: services/api/Dockerfile, target: api}
          - {service: worker, dockerfile: services/api/Dockerfile, target: worker}
          - {service: mcp, dockerfile: services/mcp/Dockerfile, target: ''}
          - {service: web, dockerfile: services/web/Dockerfile, target: ''}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: codesynapse-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Fixable HIGH and CRITICAL vulnerabilities (Trivy)
        run: just scan-image codesynapse-${{ matrix.service }}:scan

  publish:
    name: Publish ${{ matrix.service }}
    needs: scan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign keyless signing and build attestations.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, mcp, web]
        # worker is a target of the API's Dockerfile (docs/SAAS.md, 5e).
        include:
          - {service: api, dockerfile: services/api/Dockerfile, target: api}
          - {service: worker, dockerfile: services/api/Dockerfile, target: worker}
          - {service: mcp, dockerfile: services/mcp/Dockerfile, target: ''}
          - {service: web, dockerfile: services/web/Dockerfile, target: ''}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to check that the tag is on main.
          fetch-depth: 0
          persist-credentials: false
      - name: Release tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release-tag.sh "$TAG"
      # Only the small runtime stages run per architecture; Go and the web
      # app are built once on the runner (BUILDPLATFORM).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/codesynapse-${{ matrix.service }}
          # :latest moves only after the release installed on kind (job latest).
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        name: Build and push (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless)
        env:
          # Passed through env: tags and digests never reach the script text.
          IMAGE: ghcr.io/${{ github.repository_owner }}/codesynapse-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    name: Publish the Helm chart
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Release tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=$(.github/scripts/release-tag.sh "$TAG")" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package, push and sign
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Artifact Hub lists and scans the images the release deploys, and
          # shows an RC as a pre-release.
          chart=deploy/helm/codesynapse
          images=$(helm template codesynapse "$chart" --set image.tag="$VERSION" --set secrets.existingSecret=x \
            | sed -n 's/^ *image: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | sort -u \
            | awk '{ n = $0; sub(/.*\//, "", n); sub(/[:@].*/, "", n); printf "- name: %s\n  image: %s\n", n, $0 }')
          [ -n "$images" ] || { echo "::error::no images rendered"; exit 1; }
          IMAGES="$images" yq -i '.annotations."artifacthub.io/images" = strenv(IMAGES)' "$chart/Chart.yaml"
          case "$VERSION" in
            *-*) yq -i '.annotations."artifacthub.io/prerelease" = "true"' "$chart/Chart.yaml" ;;
          esac
          # Chart and app version are the release; image.tag defaults to it.
          helm package "$chart" --version "$VERSION" --app-version "$VERSION" --destination dist
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/codesynapse-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          [ -n "$digest" ] || { echo "::error::no digest from helm push"; exit 1; }
          cosign sign --yes "ghcr.io/$OWNER/charts/codesynapse@$digest"
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      # Artifact Hub reads the repository metadata from this tag; the
      # repositoryID in it makes astrona.io a verified publisher.
      - name: Push Artifact Hub metadata
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          printf '%s' "$TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
          cd deploy/helm
          oras push "ghcr.io/$OWNER/charts/codesynapse:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  verify:
    name: Install the published release on kind
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ needs.chart.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Signatures of the chart and every image
        env:
          VERSION: ${{ needs.chart.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          for ref in "charts/codesynapse:$VERSION" "codesynapse-api:$VERSION" "codesynapse-worker:$VERSION" "codesynapse-mcp:$VERSION" "codesynapse-web:$VERSION"; do
            cosign verify "ghcr.io/$OWNER/$ref" --certificate-identity-regexp "^https://github.com/$REPO/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "signed: $ref"
          done
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: codesynapse-dev
      - name: Install from the registry and test
        env:
          VERSION: ${{ needs.chart.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          kubectl --context kind-codesynapse-dev create namespace codesynapse
          kubectl --context kind-codesynapse-dev --namespace codesynapse create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username="$ACTOR" --docker-password="$TOKEN"
          just chart-install-published "$VERSION" ghcr
          just chart-test
      - name: State on failure
        if: failure()
        run: |
          kubectl --context kind-codesynapse-dev --namespace codesynapse get pods -o wide || true
          kubectl --context kind-codesynapse-dev --namespace codesynapse describe pods | tail -200 || true

  latest:
    name: Mark the release latest
    needs: verify
    # Release candidates never become latest.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tag the verified images latest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Same manifest list, so the digest and its signature carry over.
          for svc in api worker mcp web; do
            docker buildx imagetools create --tag "ghcr.io/$OWNER/codesynapse-$svc:latest" "ghcr.io/$OWNER/codesynapse-$svc:$VERSION"
          done
      - name: Mark latest once the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # The Release workflow creates it (CLI binaries); wait for it.
          for _ in $(seq 1 60); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              gh release edit "$TAG" --repo "$REPO" --latest
              exit 0
            fi
            sleep 20
          done
          echo "::error::release $TAG not found"; exit 1
