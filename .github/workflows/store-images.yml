name: Store images

# The store images of the chart and docker-compose, built where upstream's
# leave findings that scans (Artifact Hub, Trivy) keep reporting:
#   deploy/postgres  the official image with gosu rebuilt on our Go version
#   deploy/nebula    NebulaGraph's binaries on distroless instead of CentOS 7,
#                    and the console built from source with our Go version
# Pull requests build and scan only. A merge to main and a weekly rebuild
# publish a floating tag (the official image moves the same way) and sign it,
# so base-image fixes reach us within a week without a release.
#   :18-alpine, :v3.8.0         move with each rebuild
#   :<same>-YYYYMMDD            that rebuild
on:
  pull_request:
    paths:
      - 'deploy/postgres/**'
      - 'deploy/nebula/**'
      - '.trivyignore.yaml'
      - 'justfile'
      - '.github/workflows/store-images.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/postgres/**'
      - 'deploy/nebula/**'
      - '.github/workflows/store-images.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Build and scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: postgres, dir: postgres, target: '', tag: 18-alpine, gate: 'os,library'}
          - {image: nebula-metad, dir: nebula, target: metad, tag: v3.8.0, gate: 'os,library'}
          - {image: nebula-storaged, dir: nebula, target: storaged, tag: v3.8.0, gate: 'os,library'}
          - {image: nebula-graphd, dir: nebula, target: graphd, tag: v3.8.0, gate: 'os,library'}
          - {image: nebula-console, dir: nebula, target: console, tag: v3.8.0, gate: 'os,library'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/${{ matrix.dir }}
          file: deploy/${{ matrix.dir }}/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: codesynapse-${{ matrix.image }}:scan
      - name: Fixable HIGH and CRITICAL vulnerabilities (Trivy)
        run: just scan-image codesynapse-${{ matrix.image }}:scan ${{ matrix.gate }}

  publish:
    name: Publish ${{ matrix.image }}
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign keyless signing and build attestations.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: postgres, dir: postgres, target: '', tag: 18-alpine, gate: 'os,library'}
          - {image: nebula-metad, dir: nebula, target: metad, tag: v3.8.0, gate: 'os,library'}
          - {image: nebula-storaged, dir: nebula, target: storaged, tag: v3.8.0, gate: 'os,library'}
          - {image: nebula-graphd, dir: nebula, target: graphd, tag: v3.8.0, gate: 'os,library'}
          - {image: nebula-console, dir: nebula, target: console, tag: v3.8.0, gate: 'os,library'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/codesynapse-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }}-{{date 'YYYYMMDD'}}
      - id: build
        name: Build and push (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/${{ matrix.dir }}
          file: deploy/${{ matrix.dir }}/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/codesynapse-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
