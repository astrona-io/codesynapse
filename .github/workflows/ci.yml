name: CI

# Checks for every pull request and every merge to main (docs/SAAS.md, 5d).
# Each step runs a `just` recipe, so `just ci` reproduces it locally.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly: the integration contracts run even when no store code changed.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Tests (race detector)
        run: go test -race ./...

  eval:
    # docs/PLAN.md, agent workflow roadmap step 1: minimal_context and
    # search must keep finding the files past commits touched.
    name: Task eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Score against the baseline
        # The base commit may need module versions the cache lacks.
        run: just eval --allow-network

  review:
    # docs/PLAN.md, roadmap item 7: this repository reviews its own pull
    # requests with the action at its root (action.yml), and a change may
    # not introduce a high or critical finding.
    name: CodeSynapse review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          fail-on-new: high

  web:
    name: Web build and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Typecheck and build
        run: just web-check
      - name: Licences of what we ship
        run: just licenses-check

  checks:
    name: Workflows, Dockerfiles, shell, YAML, secrets, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Workflows
        run: just lint-actions
      - name: Dockerfiles
        run: just lint-docker
      - name: Shell scripts
        run: just lint-shell
      - name: YAML
        run: just lint-yaml
      - name: Secrets
        run: just secrets
      - name: Vulnerabilities and misconfigurations (Trivy)
        run: just scan
      - name: Go vulnerabilities (govulncheck)
        run: just vuln

  chart:
    name: Helm chart (lint, kubeconform, kube-linter, kubesec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Chart checks
        run: just chart-check

  changes:
    name: Store or accounts changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      stores: ${{ steps.filter.outputs.stores }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            stores:
              - 'internal/store/**'
              - 'internal/vector/**'
              - 'internal/accounts/**'
              - 'internal/model/**'
              - 'internal/telemetry/**'
              - 'services/api/internal/api/series*.go'
              - 'services/api/internal/api/stats*.go'
              - 'internal/vuln/**'
              - 'docker-compose.yml'
              - 'go.mod'
              - 'justfile'
              - '.github/scripts/compose-image.sh'
              - '.github/scripts/check-test-images.sh'

  integration:
    name: Store, accounts and metrics contracts
    needs: changes
    if: needs.changes.outputs.stores == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: PostgreSQL accounts contract
        run: just test-postgres
      - name: NebulaGraph and Milvus store contract
        run: just test-nebula
      - name: VictoriaMetrics telemetry and series contract
        run: just test-metrics
