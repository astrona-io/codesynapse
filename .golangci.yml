version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        unmaintained:
          list-mode: lax
          files: ["$all"]
          deny:
            # .trivyignore.yaml accepts GO-2026-5932 (x/crypto) only because
            # this package is never imported.
            - pkg: golang.org/x/crypto/openpgp
              desc: unmaintained and unsafe (GO-2026-5932)
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, unparam]
formatters:
  enable: [gofmt, goimports]
