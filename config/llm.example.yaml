# AI providers for CodeSynapse's generated reviews and reports.
# Copy to config/llm.yaml (git-ignored) and adjust. The api container mounts
# ./config read-only; API keys are read from the environment variables you
# name in api_key_env (put them in .env), never from this file.
#
# Inside docker compose, "host.docker.internal" is your Mac/host. Machines on
# your network are reachable by IP or hostname.

providers:
  # Local MLX server (mlx_lm.server) — also works for Ollama (port 11434),
  # vLLM, LM Studio and llama.cpp: anything OpenAI-compatible.
  - name: local-mlx
    kind: openai
    base_url: http://host.docker.internal:9080/v1
    model: mlx-community/Qwen3.8-27B-4bit
    max_output_tokens: 8000   # reasoning models think before answering; leave headroom
    disable_thinking: true    # Qwen3/R1-style models: skip the reasoning phase for fast JSON answers
    max_input_tokens: 32000   # budget per request, not the model's window: larger is slower on a Mac
    timeout_seconds: 600
    # send_source: true       # default for local providers: short code snippets allowed

  # Example cloud provider (uncomment, set ANTHROPIC_API_KEY in .env).
  # Cloud providers receive no source code unless you set send_source: true.
  # - name: claude
  #   kind: anthropic
  #   model: claude-opus-5-5
  #   api_key_env: ANTHROPIC_API_KEY
  #   effort: medium

  # Example OpenAI-compatible cloud endpoint with a key.
  # - name: openrouter
  #   kind: openai
  #   base_url: https://openrouter.ai/api/v1
  #   model: <model id>
  #   api_key_env: OPENROUTER_API_KEY

# Which provider handles which task; anything not listed uses "default".
tasks:
  security-triage: local-mlx
  review: local-mlx
  briefing: local-mlx
default: local-mlx
