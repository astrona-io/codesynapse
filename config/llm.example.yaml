# AI providers for CodeSynapse's generated reviews and reports.
# Copy to config/llm.yaml (git-ignored) and adjust. The api container mounts
# ./config read-only; API keys are read from the environment variables you
# name in api_key_env (put them in .env), never from this file.
#
# Inside docker compose, "host.docker.internal" is your Mac/host. Machines on
# your network are reachable by IP or hostname.

providers:
  # Local MLX server (mlx_lm.server) — also works for Ollama (port 11434),
  # vLLM, LM Studio and llama.cpp: anything OpenAI-compatible.
  - name: local-mlx
    kind: openai
    base_url: http://host.docker.internal:9080/v1
    model: mlx-community/Qwen3.8-27B-4bit
    context_window: 262144    # the model's full context (max_position_embeddings in its config.json)
    max_output_tokens: 32768  # longest answer; also sets how many findings go into one triage request
    disable_thinking: true    # Qwen3/R1-style models: skip the reasoning phase for fast JSON answers
    # bytes_per_token: 3      # local models: count 3 request bytes as one token (default 1, the safe upper bound)
    # kv_cache: auto          # local servers reuse the prompt cache (auto, on, off)
    # kv_cache_server: ollama # ollama, llamacpp, vllm or other; Ollama's port 11434 is detected
    # kv_cache_ttl: 15m       # how long a cached prompt is kept: up to 24h, 0 for not at all, or forever
    # max_input_tokens:       # defaults to context_window - max_output_tokens - 1024
    input_budget_policy: estimate # counts final redacted request JSON bytes conservatively
    # require_exact refuses completions until a verified model/template counter is available.
    # Estimates are not billing usage and cannot guarantee an arbitrary model's window.
    # See docs/PROMPT_BUDGETS.md for byte caps, policy and retry behavior.
    # timeout_seconds:        # defaults to max(300, max_input_tokens/100) seconds: big prompts take minutes on a Mac
    # send_source: true       # default for local providers: short code snippets allowed

  # Let CodeSynapse pick: with model and embedding_model on auto it asks the
  # server what it serves (every five minutes), uses the chat model with the
  # most parameters with that model's own context window, and an embedding
  # model for recall. Local servers only. With no providers configured at all,
  # a local Ollama (11434) or LM Studio (1234) found at start-up is used this
  # way (CODESYNAPSE_LLM_DISCOVER=false turns that off).
  # - name: local
  #   kind: openai
  #   base_url: http://host.docker.internal:11434/v1
  #   model: auto
  #   embedding_model: auto

  # Local Ollama for agent memory: extraction of facts from conversations and
  # embeddings for recall by meaning. Both run on local providers only.
  # - name: local-ollama
  #   kind: openai
  #   base_url: http://host.docker.internal:11434/v1
  #   model: llama3.1:8b                   # extracts triples from conversation turns
  #   embedding_model: nomic-embed-text    # `ollama pull nomic-embed-text`; enables vector recall
  #   # effort: none                       # thinking models (Qwen3, DeepSeek-R1): Ollama ignores
  #   #                                    # disable_thinking but honours reasoning_effort "none".
  #   # Setup guide: docs/operations/chat-memory-setup.md

  # Example cloud provider (uncomment, set ANTHROPIC_API_KEY in .env).
  # Cloud providers receive no source code unless you set send_source: true.
  # - name: claude
  #   kind: anthropic
  #   model: claude-opus-5-5
  #   api_key_env: ANTHROPIC_API_KEY
  #   effort: medium
  #   context_window: 200000  # default; raise it if your account has a larger window
  #   max_output_tokens: 32000
  #   # US dollars per million tokens, for the cost charts on the Statistics
  #   # page. These are illustrative rates, not a current provider price list.
  #   # Missing remote rates leave cost unknown. Cache writes need their own rate.
  #   price_input_per_mtok: 5
  #   price_cached_input_per_mtok: 0.5
  #   price_cache_write_per_mtok: 6.25
  #   price_output_per_mtok: 25
  #   # Set only after specifying every applicable rate; permits deliberate zeros.
  #   pricing_configured: true
  #   # Where the rates come from and when you read them; shown beside every
  #   # cost and savings figure.
  #   price_source: https://platform.claude.com/docs/en/about-claude/pricing
  #   price_checked: 2026-10-26
  #   # Or let CodeSynapse read the rates from OpenRouter's public model list
  #   # once a day (a GET of the whole list; nothing about you is sent). The
  #   # model's id there is worked out (anthropic/claude-opus-5.5); set
  #   # price_model when it differs.
  #   # price_feed: openrouter
  #   # price_model: anthropic/claude-opus-5.5

  # Local providers with all rates unset have zero token billing; hardware and
  # electricity costs are outside these estimates. Usage omitted by a provider
  # remains unknown. Cache-read tokens are still input and may still be billed.

  # Example OpenAI-compatible cloud endpoint with a key.
  # - name: openrouter
  #   kind: openai
  #   base_url: https://openrouter.ai/api/v1
  #   model: <model id>
  #   api_key_env: OPENROUTER_API_KEY

# Which provider handles which task; anything not listed uses "default".
tasks:
  security-triage: local-mlx
  review: local-mlx
  briefing: local-mlx
  code-annotation: local-mlx # indexed symbol metadata; requires repository approval and runtime identity
  fix: local-mlx         # writes fixes for accepted review comments (needs source access: use a local model)
  # pr-summary: local-mlx        # summary of a diff (local providers only; defaults to the first local one)
  # cleanup-briefing: local-mlx  # the cleanup plan in plain language (local providers only)
  # local-answer: local-mlx      # ask_local: reads files for coding agents to save their tokens (local providers only)
  # memory: local-ollama     # agent memory: facts extracted from conversation turns (local providers only)
  # embeddings: local-ollama # agent memory: recall by meaning (local, with embedding_model)
default: local-mlx
