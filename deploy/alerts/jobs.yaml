# Background job queue (docs/TELEMETRY_PLAN.md, "Alerting"). The API process
# holding the api-loops lease sets both gauges per job kind, without a
# tenant. A process that just lost the lease may still report for a moment,
# so each gauge is taken as the maximum over instances, never summed.
groups:
  - name: codesynapse-jobs
    interval: 1m
    rules:
      # Waiting jobs with none running: no worker with that role is up, or
      # every worker of it is stuck. Jobs left behind by a stopped process
      # count as waiting until another worker claims them.
      - alert: CodeSynapseJobsNotClaimed
        expr: |
          max by (kind) (platform_codesynapse_jobs_waiting) > 0
          and
          (max by (kind) (platform_codesynapse_jobs_active) - max by (kind) (platform_codesynapse_jobs_waiting)) == 0
        for: 15m
        labels:
          severity: warning
          component: jobs
        annotations:
          summary: "{{ $labels.kind }} jobs are waiting and no worker runs them"
          description: "{{ $value }} {{ $labels.kind }} jobs have waited for 15 minutes with none running. Check that a worker with that role is up (fix jobs need the fix worker)."
          dashboard: "{{ $externalURL }}/stats"

      # A kind whose jobs fail more than one time in five. Tenant and platform
      # (no organisation) jobs count together; the minimum keeps a single
      # failure on a quiet installation from paging anyone.
      - alert: CodeSynapseJobFailureRate
        expr: |
          (
            sum by (kind) (increase({__name__=~"(platform_)?codesynapse_jobs_finished_total", outcome="error"}[30m]))
            /
            sum by (kind) (increase({__name__=~"(platform_)?codesynapse_jobs_finished_total"}[30m]))
          ) > 0.2
          and
          sum by (kind) (increase({__name__=~"(platform_)?codesynapse_jobs_finished_total"}[30m])) >= 10
        labels:
          severity: warning
          component: jobs
        annotations:
          summary: "{{ $labels.kind }} jobs are failing"
          description: "{{ $value | humanizePercentage }} of {{ $labels.kind }} jobs failed in the last 30 minutes."
          dashboard: "{{ $externalURL }}/stats"
