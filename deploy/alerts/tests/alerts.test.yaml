# Unit tests for the alert rules (`just lint-alerts`, vmalert-tool unittest).
# Each rule fires on the series that should trigger it, keeps quiet on the
# ones that should not, and its alert carries no tenant_id.
rule_files:
  - ../telemetry.yaml
  - ../stores.yaml
  - ../jobs.yaml
  - ../web.yaml
evaluation_interval: 1m

tests:
  - name: series cap overflow, per instrument
    interval: 1m
    input_series:
      - series: 'telemetry_dropped_series_total{metric="mcp_tool_duration_seconds",service_name="mcp"}'
        values: '0x60 4+1x30'
      # Dropped once, more than an hour ago: quiet now.
      - series: 'telemetry_dropped_series_total{metric="http_requests_total",service_name="api"}'
        values: '3x90'
    alert_rule_test:
      - eval_time: 80m
        groupname: codesynapse-telemetry
        alertname: CodeSynapseSeriesCapOverflow
        exp_alerts:
          - exp_labels: {severity: warning, component: telemetry, metric: mcp_tool_duration_seconds}
            exp_annotations:
              summary: "mcp_tool_duration_seconds reached its series cap"
              description: "23 label combinations of mcp_tool_duration_seconds were dropped in the last hour, so panels that read it undercount. See \"Cap pressure\" in docs/TELEMETRY_PLAN.md."
              dashboard: "https://codesynapse.example.com/stats"

  - name: log lines dropped for 15 minutes
    interval: 1m
    input_series:
      - series: 'platform_log_lines_dropped_total{reason="send_failed"}'
        values: '0+10x40'
      - series: 'platform_log_lines_dropped_total{reason="too_long"}'
        values: '0x20 1x20'
    alert_rule_test:
      - eval_time: 10m
        groupname: codesynapse-telemetry
        alertname: CodeSynapseLogShippingDropping
        exp_alerts: []
      - eval_time: 35m
        groupname: codesynapse-telemetry
        alertname: CodeSynapseLogShippingDropping
        exp_alerts:
          - exp_labels: {severity: warning, component: telemetry, reason: send_failed}
            exp_annotations:
              summary: "Log lines are not reaching the log store (send_failed)"
              description: "100 log lines were dropped in the last 10 minutes for 15 minutes in a row. They are on the services' stderr only."
              dashboard: "https://codesynapse.example.com/stats"

  - name: ingest metric export rejected and over capacity
    interval: 1m
    input_series:
      - series: 'platform_ingest_metric_export_rejections_total{reason="capacity"}'
        values: '0x5 1x30'
      - series: 'platform_codesynapse_ingest_metric_series_dropped_total'
        values: '0x5 2x30'
    alert_rule_test:
      - eval_time: 20m
        groupname: codesynapse-telemetry
        alertname: CodeSynapseIngestMetricsRejected
        exp_alerts:
          - exp_labels: {severity: warning, component: telemetry, reason: capacity}
            exp_annotations:
              summary: "Indexing file totals were not exported (capacity)"
              description: "1 snapshots of the indexing file totals were rejected before export in the last hour. The totals stay in PostgreSQL; the Ingestion panels lag until an export passes."
              dashboard: "https://codesynapse.example.com/stats"
      - eval_time: 20m
        groupname: codesynapse-telemetry
        alertname: CodeSynapseIngestMetricsCapacity
        exp_alerts:
          - exp_labels: {severity: warning, component: telemetry}
            exp_annotations:
              summary: "Indexing file totals reached their repository limit"
              description: "2 file-total series were not admitted in the last hour, so some repositories have no Ingestion panels."
              dashboard: "https://codesynapse.example.com/stats"

  # Two tenants and the platform stream of the same store: the alert sums
  # them per db_system and names no tenant. Milvus stays fast.
  - name: store latency summed over tenants
    interval: 1m
    input_series:
      - series: 'db_query_duration_seconds_bucket{tenant_id="t1",db_system="nebulagraph",operation="read",le="1"}'
        values: '0+1x40'
      - series: 'db_query_duration_seconds_bucket{tenant_id="t1",db_system="nebulagraph",operation="read",le="5"}'
        values: '0+10x40'
      - series: 'db_query_duration_seconds_bucket{tenant_id="t1",db_system="nebulagraph",operation="read",le="+Inf"}'
        values: '0+10x40'
      - series: 'platform_db_query_duration_seconds_bucket{tenant_id="none",db_system="nebulagraph",operation="read",le="1"}'
        values: '0+1x40'
      - series: 'platform_db_query_duration_seconds_bucket{tenant_id="none",db_system="nebulagraph",operation="read",le="5"}'
        values: '0+10x40'
      - series: 'platform_db_query_duration_seconds_bucket{tenant_id="none",db_system="nebulagraph",operation="read",le="+Inf"}'
        values: '0+10x40'
      - series: 'db_query_duration_seconds_bucket{tenant_id="t2",db_system="milvus",operation="search",le="1"}'
        values: '0+10x40'
      - series: 'db_query_duration_seconds_bucket{tenant_id="t2",db_system="milvus",operation="search",le="5"}'
        values: '0+10x40'
      - series: 'db_query_duration_seconds_bucket{tenant_id="t2",db_system="milvus",operation="search",le="+Inf"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 8m
        groupname: codesynapse-stores
        alertname: CodeSynapseStoreSlow
        exp_alerts: []
      - eval_time: 30m
        groupname: codesynapse-stores
        alertname: CodeSynapseStoreSlow
        exp_alerts:
          - exp_labels: {severity: warning, component: stores, db_system: nebulagraph}
            exp_annotations:
              summary: "nebulagraph answers slowly"
              description: "95% of nebulagraph round trips took up to 4.778s over the last 10 minutes, above 1 s for 10 minutes."
              dashboard: "https://codesynapse.example.com/stats"

  - name: store errors, with a minimum call rate
    interval: 1m
    input_series:
      # PostgreSQL: 10 calls a minute, 1 failing (10%).
      - series: 'db_query_duration_seconds_count{tenant_id="t1",db_system="postgres",operation="query"}'
        values: '0+10x40'
      - series: 'db_query_errors_total{tenant_id="t1",db_system="postgres",operation="query"}'
        values: '0+1x40'
      # Milvus: one call in ten minutes, and it failed. Too few calls to page.
      - series: 'platform_db_query_duration_seconds_count{tenant_id="none",db_system="milvus",operation="search"}'
        values: '0x10 1x30'
      - series: 'platform_db_query_errors_total{tenant_id="none",db_system="milvus",operation="search"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 30m
        groupname: codesynapse-stores
        alertname: CodeSynapseStoreErrors
        exp_alerts:
          - exp_labels: {severity: critical, component: stores, db_system: postgres}
            exp_annotations:
              summary: "postgres calls are failing"
              description: "10% of postgres round trips failed over the last 10 minutes, above 5% for 10 minutes."
              dashboard: "https://codesynapse.example.com/stats"

  - name: jobs waiting with none running
    interval: 1m
    input_series:
      # fix: two waiting, none running. sync: one waiting, one running.
      - series: 'platform_codesynapse_jobs_waiting{kind="fix",service_instance_id="api-1"}'
        values: '2x30'
      - series: 'platform_codesynapse_jobs_active{kind="fix",service_instance_id="api-1"}'
        values: '2x30'
      - series: 'platform_codesynapse_jobs_waiting{kind="sync",service_instance_id="api-1"}'
        values: '1x30'
      - series: 'platform_codesynapse_jobs_active{kind="sync",service_instance_id="api-1"}'
        values: '2x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: codesynapse-jobs
        alertname: CodeSynapseJobsNotClaimed
        exp_alerts: []
      - eval_time: 20m
        groupname: codesynapse-jobs
        alertname: CodeSynapseJobsNotClaimed
        exp_alerts:
          - exp_labels: {severity: warning, component: jobs, kind: fix}
            exp_annotations:
              summary: "fix jobs are waiting and no worker runs them"
              description: "2 fix jobs have waited for 15 minutes with none running. Check that a worker with that role is up (fix jobs need the fix worker)."
              dashboard: "https://codesynapse.example.com/stats"

  - name: job failure rate, per kind
    interval: 1m
    input_series:
      # sync: half of its jobs fail, across a tenant and the platform twin.
      - series: 'codesynapse_jobs_finished_total{kind="sync",outcome="ok",tenant_id="org-a",service_instance_id="api-1"}'
        values: '0+1x40'
      - series: 'platform_codesynapse_jobs_finished_total{kind="sync",outcome="error",service_instance_id="api-1"}'
        values: '0+1x40'
      # clone: one failure in ten minutes against one success a minute.
      - series: 'codesynapse_jobs_finished_total{kind="clone",outcome="ok",tenant_id="org-a",service_instance_id="api-1"}'
        values: '0+1x40'
      - series: 'codesynapse_jobs_finished_total{kind="clone",outcome="error",tenant_id="org-a",service_instance_id="api-1"}'
        values: '0+0.1x40'
      # fix: every job fails, but too few ran to alert.
      - series: 'codesynapse_jobs_finished_total{kind="fix",outcome="error",tenant_id="org-a",service_instance_id="api-1"}'
        values: '0+0.1x40'
    alert_rule_test:
      - eval_time: 35m
        groupname: codesynapse-jobs
        alertname: CodeSynapseJobFailureRate
        exp_alerts:
          - exp_labels: {severity: warning, component: jobs, kind: sync}
            exp_annotations:
              summary: "sync jobs are failing"
              description: "50% of sync jobs failed in the last 30 minutes."
              dashboard: "https://codesynapse.example.com/stats"

  - name: metric export failures, per exporter
    interval: 1m
    input_series:
      - series: 'platform_telemetry_export_failures_total{exporter="otlp",service_instance_id="api-1"}'
        values: '0+1x40'
      # ingest: one failure, then fine.
      - series: 'platform_telemetry_export_failures_total{exporter="ingest",service_instance_id="api-1"}'
        values: '0 1x40'
    alert_rule_test:
      - eval_time: 30m
        groupname: codesynapse-telemetry
        alertname: CodeSynapseMetricsExportFailing
        exp_alerts:
          - exp_labels: {severity: warning, component: telemetry, exporter: otlp}
            exp_annotations:
              summary: "otlp metric exports are failing"
              description: "10 otlp exports failed in the last 10 minutes for 15 minutes in a row, so panels miss data."
              dashboard: "https://codesynapse.example.com/stats"

  - name: scheduler lease lost
    interval: 1m
    input_series:
      - series: 'platform_codesynapse_lease_events_total{lease="api_loops",event="lost",service_instance_id="api-1"}'
        values: '0x10 1x30'
      # Job leases do not page about the scheduler.
      - series: 'platform_codesynapse_lease_events_total{lease="job",event="lost",service_instance_id="api-2"}'
        values: '0 1x40'
    alert_rule_test:
      - eval_time: 5m
        groupname: codesynapse-scheduler
        alertname: CodeSynapseSchedulerLeaseLost
        exp_alerts: []
      - eval_time: 15m
        groupname: codesynapse-scheduler
        alertname: CodeSynapseSchedulerLeaseLost
        exp_alerts:
          - exp_labels: {severity: warning, component: scheduler}
            exp_annotations:
              summary: "An API replica lost the scheduler lease"
              description: "The scheduler lease was lost 1 times in the last 15 minutes. Check the API replicas' connection to PostgreSQL."
              dashboard: "https://codesynapse.example.com/admin"

  - name: no scheduler holder
    interval: 1m
    input_series:
      # api-1 holds the lease for 10 minutes, then nobody does.
      - series: 'platform_codesynapse_loops_lease_held{service_instance_id="api-1"}'
        values: '1x10 0x30'
      - series: 'platform_codesynapse_loops_lease_held{service_instance_id="api-2"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 12m
        groupname: codesynapse-scheduler
        alertname: CodeSynapseNoSchedulerHolder
        exp_alerts: []
      - eval_time: 30m
        groupname: codesynapse-scheduler
        alertname: CodeSynapseNoSchedulerHolder
        exp_alerts:
          - exp_labels: {severity: critical, component: scheduler}
            exp_annotations:
              summary: "No API replica runs the scheduler"
              description: "For 10 minutes no API replica has held the scheduler lease, so scheduled syncs, watches and audit sealing do not run."
              dashboard: "https://codesynapse.example.com/admin"

  - name: dashboard cannot reach the API
    interval: 1m
    input_series:
      # A call a second reaches the API throughout; after 10 minutes, half
      # as many again find it unreachable.
      - series: 'platform_web_proxy_requests_total{outcome="ok",service_instance_id="web-1"}'
        values: '0+60x40'
      - series: 'platform_web_proxy_requests_total{outcome="unreachable",service_instance_id="web-1"}'
        values: '0x10 30+30x30'
      # Refused calls are the browser's doing and do not count.
      - series: 'platform_web_proxy_requests_total{outcome="refused",service_instance_id="web-1"}'
        values: '0+600x40'
    alert_rule_test:
      - eval_time: 12m
        groupname: codesynapse-web
        alertname: CodeSynapseDashboardAPIUnreachable
        exp_alerts: []
      - eval_time: 30m
        groupname: codesynapse-web
        alertname: CodeSynapseDashboardAPIUnreachable
        exp_alerts:
          - exp_labels: {severity: critical, component: web}
            exp_annotations:
              summary: "The dashboard cannot reach the API"
              description: "33.33% of the dashboard's API calls found the API unreachable or timed out over the last 10 minutes, above 5% for 10 minutes."
              dashboard: "https://codesynapse.example.com/admin"

  - name: idle dashboard with one failure
    interval: 1m
    input_series:
      - series: 'platform_web_proxy_requests_total{outcome="ok",service_instance_id="web-1"}'
        values: '0x40'
      - series: 'platform_web_proxy_requests_total{outcome="timeout",service_instance_id="web-1"}'
        values: '0x5 1x35'
    alert_rule_test:
      - eval_time: 30m
        groupname: codesynapse-web
        alertname: CodeSynapseDashboardAPIUnreachable
        exp_alerts: []
