{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) }}
{{- /* Generated once and kept: an upgrade reads the value back, so the password
       shown by `kubectl get secret` stays the one the installation started
       with. `helm template` cannot look it up and renders a fresh value. */ -}}
{{- $name := include "cs.name" (list . "admin") -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cs.labels" (list . "admin") | nindent 4 }}
  annotations:
    # Uninstalling keeps it: the database may outlive the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  CODESYNAPSE_ADMIN_PASSWORD: {{ if $existing }}{{ index $existing.data "CODESYNAPSE_ADMIN_PASSWORD" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
