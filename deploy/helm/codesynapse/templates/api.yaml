# The API serves the dashboard and agents' API calls and records jobs for the
# workers (CODESYNAPSE_RUN_JOBS=false in its image). Several replicas are
# safe: one at a time runs the scheduler and maintenance loops (a lease).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cs.name" (list . "api") }}
  labels:
    {{- include "cs.labels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "cs.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cs.labels" (list . "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cs.name" (list . "codesynapse") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "cs.podSecurity" 10001 | nindent 8 }}
      containers:
        - name: api
          image: {{ include "cs.image" (list . "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          ports:
            - {name: http, containerPort: 8080}
          env:
            {{- include "cs.apiEnv" . | nindent 12 }}
            - {name: CODESYNAPSE_RUN_JOBS, value: "false"}
            - {name: GOMEMLIMIT, value: {{ include "cs.gomemlimit" .Values.api.resources | quote }}}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "cs.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: llm, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: {{ include "cs.name" (list . "workspace") }}}
        - name: llm
          configMap: {name: {{ include "cs.name" (list . "llm") }}}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cs.name" (list . "api") }}
  labels:
    {{- include "cs.labels" (list . "api") | nindent 4 }}
spec:
  selector:
    {{- include "cs.selector" (list . "api") | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
