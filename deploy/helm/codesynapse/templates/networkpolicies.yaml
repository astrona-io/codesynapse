{{- if .Values.global.networkPolicies }}
{{- $root := . }}
# Only the paths that are needed. Stores accept api, worker and mcp (their
# policies live in the store subcharts); the API accepts the dashboard, mcp
# (memory offload) and the chart's test; workers accept nothing (they parse
# untrusted repositories). web and mcp face users and agents through the
# ingress. Egress stays open: workers reach git hosts, osv.dev and deps.dev,
# and model providers.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cs.name" (list . "api") }}
  labels:
    {{- include "cs.labels" (list . "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cs.selector" (list . "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $client := list "web" "mcp" "test" }}
        - podSelector:
            matchLabels:
              {{- include "cs.selector" (list $root $client) | nindent 14 }}
        {{- end }}
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cs.name" (list . "worker") }}
  labels:
    {{- include "cs.labels" (list . "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cs.selector" (list . "worker") | nindent 6 }}
  policyTypes: [Ingress]
{{- end }}
