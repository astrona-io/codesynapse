# Defaults for the in-chart NebulaGraph. Override them under `nebula:` in the
# codesynapse chart's values.
# One pod runs metad, storaged and graphd together (a single instance, like
# the other in-chart stores); for a cluster run NebulaGraph yourself and set
# nebula.externalAddrs.
# Upstream's binaries on distroless (deploy/nebula): the servers have no shell
# or curl, so the probes run /usr/local/bin/nebula-probe.
images:
  metad: ghcr.io/astrona-io/codesynapse-nebula-metad:v3.8.0
  storaged: ghcr.io/astrona-io/codesynapse-nebula-storaged:v3.8.0
  graphd: ghcr.io/astrona-io/codesynapse-nebula-graphd:v3.8.0
  # Registers the storage host and replaces the first root password.
  console: ghcr.io/astrona-io/codesynapse-nebula-console:v3.8.0
size: 20Gi
storageClass: ""
resources:
  requests: {cpu: 500m, memory: 2Gi}
  limits: {memory: 4Gi}
