apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cs.name" (list . "nebula") }}
  labels:
    {{- include "cs.labels" (list . "nebula") | nindent 4 }}
spec:
  serviceName: {{ include "cs.name" (list . "nebula") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "cs.selector" (list . "nebula") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cs.labels" (list . "nebula") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cs.serviceAccount" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "cs.podSecurity" 10001 | nindent 8 }}
      containers:
        # The three services share the pod and talk over loopback; only
        # graphd's port is published (Service, network policy). Schema
        # changes reach graphd and storaged on their heartbeat: a short
        # interval keeps `ensure schema` quick.
        - name: metad
          image: {{ .Values.images.metad }}
          args: [--meta_server_addrs=127.0.0.1:9559, --local_ip=127.0.0.1, --ws_ip=127.0.0.1, --port=9559, --data_path=/data/meta, --log_dir=/logs/metad, --pid_file=/tmp/metad.pid, --v=0, --minloglevel=1, --heartbeat_interval_secs=2]
          # Status port; it listens on loopback only.
          ports:
            - {name: metad-status, containerPort: 19559}
          # The status port listens on the pod's loopback only (--ws_ip), so
          # the probes run inside the container: an httpGet with host
          # 127.0.0.1 is sent by the kubelet to the node's loopback instead,
          # never connects, and had the pod restarted for good.
          startupProbe:
            exec: {command: [/usr/local/bin/nebula-probe, "127.0.0.1:19559"]}
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec: {command: [/usr/local/bin/nebula-probe, "127.0.0.1:19559"]}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            {{- include "cs.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data/meta, subPath: meta}
            - {name: scratch, mountPath: /logs, subPath: logs}
            - {name: scratch, mountPath: /tmp, subPath: tmp}
        - name: storaged
          image: {{ .Values.images.storaged }}
          args: [--meta_server_addrs=127.0.0.1:9559, --local_ip=127.0.0.1, --ws_ip=127.0.0.1, --port=9779, --data_path=/data/storage, --cluster_id_path=/data/storage/cluster.id, --log_dir=/logs/storaged, --pid_file=/tmp/storaged.pid, --v=0, --minloglevel=1, --heartbeat_interval_secs=2]
          # The root filesystem is read-only, so cluster.id (written to the
          # working directory by default) goes to the data volume; without it
          # storaged never joins metad. No probe on the service itself:
          # storaged serves nothing until the init container below has
          # registered it.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "cs.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data/storage, subPath: storage}
            - {name: scratch, mountPath: /logs, subPath: logs}
            - {name: scratch, mountPath: /tmp, subPath: tmp}
        - name: graphd
          image: {{ .Values.images.graphd }}
          args: [--meta_server_addrs=127.0.0.1:9559, --local_ip=127.0.0.1, --ws_ip=127.0.0.1, --port=9669, --log_dir=/logs/graphd, --pid_file=/tmp/graphd.pid, --v=0, --minloglevel=1, --enable_authorize=true, --auth_type=password, --heartbeat_interval_secs=2]
          ports:
            - {name: graph, containerPort: 9669}
            # Status port; it listens on loopback only.
            - {name: graphd-status, containerPort: 19669}
          startupProbe:
            exec: {command: [/usr/local/bin/nebula-probe, "127.0.0.1:19669"]}
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec: {command: [/usr/local/bin/nebula-probe, "127.0.0.1:19669"]}
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            tcpSocket: {port: graph}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            {{- include "cs.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: scratch, mountPath: /logs, subPath: logs}
            - {name: scratch, mountPath: /tmp, subPath: tmp}
        # Registers the storage host, replaces the well-known first password
        # of root with NEBULA_PASSWORD, creates the space and one user per
        # service (api: DBA, owns the schema; worker and mcp: USER, data
        # only), then reports ready and sleeps. Only this container holds the
        # root password. Idempotent across restarts; a changed service
        # password in the Secret is applied when the pod restarts. The
        # console exits 0 on a statement error, so its output is checked.
        - name: init
          image: {{ .Values.images.console }}
          command:
            - sh
            - -c
            - |
              # Passwords go into nGQL text, so only a plain alphabet is
              # allowed; NebulaGraph accepts at most 24 characters.
              chk() {
                [ -n "$2" ] || { echo "$1 is not set in the Secret" >&2; exit 1; }
                [ "${#2}" -le 24 ] || { echo "$1 is longer than 24 characters" >&2; exit 1; }
                case "$2" in *[!A-Za-z0-9._~+/=-]*) echo "$1 may only hold letters, digits and ._~+/=-" >&2; exit 1;; esac
              }
              chk NEBULA_PASSWORD "$NEBULA_PASSWORD"
              chk NEBULA_API_PASSWORD "$NEBULA_API_PASSWORD"
              chk NEBULA_WORKER_PASSWORD "$NEBULA_WORKER_PASSWORD"
              chk NEBULA_MCP_PASSWORD "$NEBULA_MCP_PASSWORD"
              c() { nebula-console -addr 127.0.0.1 -port 9669 -u root -p "$1" -e "$2"; }
              run() {
                out=$(c "$NEBULA_PASSWORD" "$1" 2>&1)
                case "$out" in *ERROR*) return 1;; esac
              }
              n=0
              until c "$NEBULA_PASSWORD" 'SHOW HOSTS' >/dev/null 2>&1 || c nebula 'SHOW HOSTS' >/dev/null 2>&1; do
                n=$((n+1)); [ "$n" -lt 120 ] || { echo 'graphd did not answer' >&2; exit 1; }; sleep 2
              done
              if c nebula 'SHOW HOSTS' >/dev/null 2>&1; then
                out=$(c nebula "CHANGE PASSWORD root FROM \"nebula\" TO \"$NEBULA_PASSWORD\"" 2>&1)
                case "$out" in *ERROR*) echo "$out" >&2; exit 1;; esac
              fi
              n=0
              until c "$NEBULA_PASSWORD" 'SHOW HOSTS' >/dev/null 2>&1; do
                n=$((n+1)); [ "$n" -lt 60 ] || { echo 'the new password was not accepted' >&2; exit 1; }; sleep 2
              done
              c "$NEBULA_PASSWORD" 'ADD HOSTS "127.0.0.1":9779' >/dev/null
              n=0
              until c "$NEBULA_PASSWORD" 'SHOW HOSTS' | grep -q ONLINE; do
                n=$((n+1)); [ "$n" -lt 60 ] || { echo 'storaged did not come online' >&2; exit 1; }; sleep 2
              done
              run "CREATE SPACE IF NOT EXISTS \`codesynapse\` (partition_num = {{ int .Values.space.partitions }}, replica_factor = {{ int .Values.space.replicas }}, vid_type = FIXED_STRING(40))" \
                || { echo "$out" >&2; exit 1; }
              for u in "{{ .Values.users.api }} DBA $NEBULA_API_PASSWORD" "{{ .Values.users.worker }} USER $NEBULA_WORKER_PASSWORD" "{{ .Values.users.mcp }} USER $NEBULA_MCP_PASSWORD"; do
                set -- $u
                run "CREATE USER IF NOT EXISTS $1 WITH PASSWORD \"$3\"" || { echo "creating user $1 failed" >&2; exit 1; }
                run "ALTER USER $1 WITH PASSWORD \"$3\"" || { echo "setting the password of $1 failed" >&2; exit 1; }
                # graphd sees a new space on its next heartbeat.
                n=0
                until run "GRANT ROLE $2 ON \`codesynapse\` TO $1"; do
                  n=$((n+1)); [ "$n" -lt 60 ] || { echo "granting $2 to $1 failed" >&2; exit 1; }; sleep 2
                done
              done
              touch /tmp/ready
              exec sleep infinity
          env:
            {{- include "cs.secretEnv" (list . "NEBULA_PASSWORD" "NEBULA_PASSWORD") | nindent 12 }}
            {{- include "cs.secretEnv" (list . "NEBULA_API_PASSWORD" "NEBULA_API_PASSWORD") | nindent 12 }}
            {{- include "cs.secretEnv" (list . "NEBULA_WORKER_PASSWORD" "NEBULA_WORKER_PASSWORD") | nindent 12 }}
            {{- include "cs.secretEnv" (list . "NEBULA_MCP_PASSWORD" "NEBULA_MCP_PASSWORD") | nindent 12 }}
          readinessProbe:
            exec: {command: [test, -f, /tmp/ready]}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            {{- include "cs.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: scratch, mountPath: /tmp, subPath: init}
      volumes:
        - name: scratch
          emptyDir: {}
  {{- include "cs.volumeClaim" (list . .Values) | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cs.name" (list . "nebula") }}
  labels:
    {{- include "cs.labels" (list . "nebula") | nindent 4 }}
spec:
  selector:
    {{- include "cs.selector" (list . "nebula") | nindent 4 }}
  ports:
    - {name: graph, port: 9669, targetPort: graph}
