# Values the chart checks render with (`just chart-check`): every optional
# part on, so every template is validated.
secrets:
  existingSecret: codesynapse
ingress:
  enabled: true
  host: codesynapse.example.com
  tlsSecretName: codesynapse-tls
llmConfig: |
  providers: []
api:
  autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 4, targetCPU: 70}
mcp:
  replicas: 2
