# Values the chart checks render with (`just chart-check`): every optional
# part on, so every template is validated.
global:
  existingSecret: codesynapse
ingress:
  enabled: true
  host: codesynapse.example.com
  tlsSecretName: codesynapse-tls
llmConfig: |
  providers: []
api:
  autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 4, targetCPU: 70}
mcp:
  replicas: 2
# The fix worker renders too (it needs allowPush).
features:
  allowPush: true
fixWorker:
  enabled: true
# Worker egress rules render too.
worker:
  restrictEgress: true
  egressAllow:
    - {cidr: 10.20.0.0/24, ports: [5432]}
    - {cidr: 10.30.0.5/32}
# vmalert renders too (off by default).
alerting:
  enabled: true
