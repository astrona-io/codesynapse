# A throwaway kind cluster (`just chart-e2e`): images built locally and
# loaded into the node, small requests, plain HTTP through port-forward.
global:
  existingSecret: codesynapse
image:
  registry: ghcr.io/astrona-io
  tag: e2e
  pullPolicy: Never
cookieSecure: false
environment: kind
# Two API and MCP replicas, so the shared limits, the loops lease and
# stateless MCP run as they would in production.
api:
  replicas: 2
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
worker:
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 3Gi}}
mcp:
  replicas: 2
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}
web:
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}
postgresql:
  size: 1Gi
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
nebula:
  size: 2Gi
  resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 2Gi}}
milvus:
  size: 2Gi
  resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 3Gi}}
victoriametrics:
  size: 1Gi
victoriatraces:
  size: 1Gi
workspace:
  size: 2Gi
