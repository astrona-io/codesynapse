apiVersion: v2
name: codesynapse
description: CodeSynapse indexes code, docs, configuration and dependencies into a graph and serves precise answers to AI agents (MCP) and a dashboard.
type: application
# The chart version follows the release tag (docs/SAAS.md, 6b).
version: 0.1.0
appVersion: "dev"
home: https://github.com/astrona-io/codesynapse
sources:
  - https://github.com/astrona-io/codesynapse
keywords: [code-intelligence, mcp, graph, security]
annotations:
  artifacthub.io/license: Apache-2.0
dependencies:
  # Helpers for this chart and the stores below.
  - name: common
    version: 0.1.0
  # The stores, each switched off by <store>.enabled=false to use your own.
  - name: postgresql
    version: 0.1.0
    condition: postgresql.enabled
  - name: hugegraph
    version: 0.1.0
    condition: hugegraph.enabled
  - name: milvus
    version: 0.1.0
    condition: milvus.enabled
  - name: victoriametrics
    version: 0.1.0
    condition: victoriametrics.enabled
  - name: victoriatraces
    version: 0.1.0
    condition: victoriatraces.enabled
