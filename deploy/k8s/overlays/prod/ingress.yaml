# Replace the hosts and the TLS secret, and set ingressClassName if your
# cluster needs one. The API is not exposed: only the dashboard (which
# proxies to it) and the MCP endpoint, which is bearer-token protected.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codesynapse
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # MCP streams
spec:
  # ingressClassName: nginx
  tls:
    - hosts: [codesynapse.example.com, mcp.codesynapse.example.com]
      secretName: codesynapse-tls
  rules:
    - host: codesynapse.example.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
    - host: mcp.codesynapse.example.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: mcp, port: {number: 8090}}}}
