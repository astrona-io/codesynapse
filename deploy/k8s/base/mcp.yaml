apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels: {app.kubernetes.io/name: mcp, app.kubernetes.io/part-of: codesynapse}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp, app.kubernetes.io/part-of: codesynapse}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # The workspace volume is ReadWriteOnce: read it from the node the API
      # runs on. With a ReadWriteMany storage class this can be removed.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: api}
      containers:
        - name: mcp
          image: codesynapse-mcp
          args: [serve]
          ports:
            - {name: http, containerPort: 8090}
          env:
            - {name: CODESYNAPSE_NEO4J_URI, valueFrom: {configMapKeyRef: {name: codesynapse-config, key: CODESYNAPSE_NEO4J_URI}}}
            - name: CODESYNAPSE_NEO4J_PASSWORD
              valueFrom: {secretKeyRef: {name: codesynapse-secrets, key: NEO4J_PASSWORD}}
            - name: CODESYNAPSE_MCP_TOKEN
              valueFrom: {secretKeyRef: {name: codesynapse-secrets, key: CODESYNAPSE_MCP_TOKEN}}
            # offload_turns: the API extracts memory triples with a local model.
            - name: CODESYNAPSE_API_URL
              value: http://api:8080
            - name: CODESYNAPSE_API_TOKEN
              valueFrom: {secretKeyRef: {name: codesynapse-secrets, key: CODESYNAPSE_API_TOKEN}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          # The service waits for Neo4j before it listens; do not let liveness kill it meanwhile.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: workspace, mountPath: /workspace, readOnly: true}
            - {name: sources, mountPath: /sources, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: workspace, readOnly: true}
        - {name: sources, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  labels: {app.kubernetes.io/name: mcp, app.kubernetes.io/part-of: codesynapse}
spec:
  selector: {app.kubernetes.io/name: mcp}
  ports:
    - {name: http, port: 8090, targetPort: http}
