# Non-secret settings shared by the services. Secrets (passwords, tokens)
# come from the codesynapse-secrets Secret that each overlay generates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codesynapse-config
data:
  # Module downloads during ingest. Keep false for repositories you do not trust.
  CODESYNAPSE_ALLOW_NETWORK: "false"
  # Check dependencies against osv.dev (sends module paths + versions only).
  CODESYNAPSE_VULN_SCAN: "true"
  # Look up dependency licences not found on disk on deps.dev (package names + versions only).
  CODESYNAPSE_LICENSE_LOOKUP: "true"
  CODESYNAPSE_ALLOW_PRIVATE_GIT: "false"
  # Push fix branches for accepted review comments and open draft PRs.
  CODESYNAPSE_ALLOW_PUSH: "false"
  # Agent memory MCP tools (upsert_graph_triples, ...): write only to the memory store. "false" turns them off.
  CODESYNAPSE_ALLOW_MEMORY: "true"
  # MCP usage counters for the Statistics page (aggregates only, never arguments or results).
  CODESYNAPSE_MCP_USAGE: "true"
  CODESYNAPSE_GIT_TOKEN_HOST: github.com
  CODESYNAPSE_GIT_AUTHOR_NAME: CodeSynapse
  CODESYNAPSE_GIT_AUTHOR_EMAIL: codesynapse@localhost
