# Only the paths that are needed: web and mcp -> api (mcp hands turns to
# memory extraction). The graph and vector stores (HugeGraph, Milvus) are not
# deployed yet (phase 6a, see README). The browser-facing pods (web, mcp)
# accept traffic from anywhere in the cluster or the ingress controller.
# Egress stays open: the API reaches git hosts, api.github.com, osv.dev and
# api.deps.dev.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-web
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: web}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: mcp}}
      ports: [{port: 8080}]
