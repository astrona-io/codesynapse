apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codesynapse
resources:
  - namespace.yaml
  - config.yaml
  - api.yaml
  - mcp.yaml
  - web.yaml
  - networkpolicy.yaml
# Image names are placeholders; overlays point them at your registry and tag.
images:
  - name: codesynapse-api
    newName: ghcr.io/astrona-io/codesynapse-api
    newTag: latest
  - name: codesynapse-mcp
    newName: ghcr.io/astrona-io/codesynapse-mcp
    newTag: latest
  - name: codesynapse-web
    newName: ghcr.io/astrona-io/codesynapse-web
    newTag: latest
