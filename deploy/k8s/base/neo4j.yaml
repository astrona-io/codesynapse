apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels: {app.kubernetes.io/name: neo4j, app.kubernetes.io/part-of: codesynapse}
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: neo4j}
  template:
    metadata:
      labels: {app.kubernetes.io/name: neo4j, app.kubernetes.io/part-of: codesynapse}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: neo4j
          image: docker.io/library/neo4j:5.26-community
          ports:
            - {name: bolt, containerPort: 7687}
            - {name: http, containerPort: 7474}
          env:
            # Not NEO4J_*: the image turns every NEO4J_* variable into a setting.
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: codesynapse-secrets, key: NEO4J_PASSWORD}}
            - name: NEO4J_AUTH
              value: neo4j/$(ADMIN_PASSWORD)
            - name: NEO4J_server_memory_heap_max__size
              valueFrom: {configMapKeyRef: {name: codesynapse-config, key: NEO4J_HEAP}}
            - name: NEO4J_server_memory_pagecache_size
              valueFrom: {configMapKeyRef: {name: codesynapse-config, key: NEO4J_PAGECACHE}}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: {cpu: 250m, memory: 1536Mi}
            limits: {memory: 2560Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: logs, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  labels: {app.kubernetes.io/name: neo4j, app.kubernetes.io/part-of: codesynapse}
spec:
  selector: {app.kubernetes.io/name: neo4j}
  ports:
    - {name: bolt, port: 7687, targetPort: bolt}
    - {name: http, port: 7474, targetPort: http}
