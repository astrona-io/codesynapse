# yaml-language-server: $schema=../schema.json
id: weak-hash
title: MD5 or SHA-1 used
severity: medium
cwe: [CWE-328]
category: code
languages: [go, python, javascript, typescript, java, kotlin, rust, csharp]
why: MD5 and SHA-1 collisions are practical; they must not protect passwords, signatures or integrity checks.
fix: Use SHA-256 or better; MD5/SHA-1 only for non-security checksums.
references:
  - https://cwe.mitre.org/data/definitions/328.html
examples:
  - language: go
    vulnerable: sum := md5.Sum(data)
    fixed: sum := sha256.Sum256(data)
  - language: python
    vulnerable: hashlib.md5(data).hexdigest()
    fixed: 'hashlib.sha256(data).hexdigest()  # or hashlib.md5(data, usedforsecurity=False) for cache keys'
  - language: typescript
    vulnerable: crypto.createHash('md5').update(data)
    fixed: crypto.createHash('sha256').update(data)
  - language: java
    vulnerable: 'MessageDigest.getInstance("MD5").digest(password);'
    fixed: 'MessageDigest.getInstance("SHA-256").digest(data); // and Argon2/bcrypt for passwords'
  - language: rust
    vulnerable: 'let digest = md5::compute(password);'
    fixed: 'let digest = Sha256::digest(data); // and argon2 for passwords'
  - language: csharp
    vulnerable: 'using var md5 = MD5.Create();'
    fixed: 'var digest = SHA256.HashData(data); // and PBKDF2/Argon2 for passwords'
