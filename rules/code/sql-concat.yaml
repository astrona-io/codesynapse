# yaml-language-server: $schema=../schema.json
id: sql-concat
title: SQL query built from non-constant strings
severity: high
cwe: [CWE-89]
category: code
languages: [go, python, javascript, typescript, java, kotlin, rust, csharp, php, ruby]
why: 'Building SQL from strings lets input change the query itself: read other rows, bypass auth, drop tables.'
fix: Use placeholders ($1, ?) and pass values as arguments.
references:
  - https://cwe.mitre.org/data/definitions/89.html
examples:
  - language: go
    vulnerable: db.QueryContext(ctx, "SELECT * FROM users WHERE name = '"+name+"'")
    fixed: db.QueryContext(ctx, "SELECT * FROM users WHERE name = $1", name)
  - language: python
    vulnerable: cur.execute(f"SELECT * FROM users WHERE name = '{name}'")
    fixed: cur.execute("SELECT * FROM users WHERE name = %s", (name,))
  - language: typescript
    vulnerable: db.query(`SELECT * FROM users WHERE name = '${name}'`)
    fixed: db.query('SELECT * FROM users WHERE name = $1', [name])
  - language: java
    vulnerable: 'stmt.executeQuery("SELECT * FROM users WHERE id = ''" + id + "''");'
    fixed: 'PreparedStatement ps = conn.prepareStatement("SELECT * FROM users WHERE id = ?"); ps.setString(1, id);'
  - language: rust
    vulnerable: 'sqlx::query(&format!("SELECT * FROM users WHERE name = ''{}''", name)).fetch_all(&pool).await?;'
    fixed: 'sqlx::query("SELECT * FROM users WHERE name = $1").bind(name).fetch_all(&pool).await?;'
  - language: csharp
    vulnerable: 'conn.Query<User>($"SELECT * FROM users WHERE name = ''{name}''");'
    fixed: 'conn.Query<User>("SELECT * FROM users WHERE name = @name", new { name });'
  - language: php
    vulnerable: '$pdo->query("SELECT * FROM users WHERE name = ''$name''");'
    fixed: '$stmt = $pdo->prepare(''SELECT * FROM users WHERE name = ?''); $stmt->execute([$name]);'
  - language: ruby
    vulnerable: 'User.where("name = ''#{name}''")'
    fixed: 'User.where(name: name)'
