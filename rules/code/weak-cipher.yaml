# yaml-language-server: $schema=../schema.json
id: weak-cipher
title: DES or RC4 used
severity: high
cwe: [CWE-327]
category: code
languages: [go, java, kotlin, csharp, php]
why: DES and RC4 are broken; encrypted data can be recovered.
fix: Use AES-GCM or ChaCha20-Poly1305.
references:
  - https://cwe.mitre.org/data/definitions/327.html
examples:
  - language: go
    vulnerable: block, _ := des.NewCipher(key)
    fixed: |-
      block, _ := aes.NewCipher(key) // 32-byte key
      aead, _ := cipher.NewGCM(block)
  - language: java
    vulnerable: 'Cipher.getInstance("AES/ECB/PKCS5Padding");'
    fixed: 'Cipher.getInstance("AES/GCM/NoPadding");'
  - language: csharp
    vulnerable: 'aes.Mode = CipherMode.ECB;'
    fixed: 'using var aes = new AesGcm(key, tagSizeInBytes: 16);'
  - language: php
    vulnerable: 'openssl_encrypt($data, ''aes-128-ecb'', $key);'
    fixed: 'openssl_encrypt($data, ''aes-256-gcm'', $key, 0, $iv, $tag);'
