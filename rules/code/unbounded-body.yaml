# yaml-language-server: $schema=../schema.json
id: unbounded-body
title: Request body read without a size limit
severity: low
cwe: [CWE-400]
category: code
languages: [go]
why: Reading a whole request body without a limit lets one request exhaust memory.
fix: Wrap r.Body with http.MaxBytesReader.
references:
  - https://cwe.mitre.org/data/definitions/400.html
examples:
  - language: go
    vulnerable: body, err := io.ReadAll(r.Body)
    fixed: |-
      r.Body = http.MaxBytesReader(w, r.Body, 1<<20)
      body, err := io.ReadAll(r.Body)
