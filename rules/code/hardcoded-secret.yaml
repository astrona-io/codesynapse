# yaml-language-server: $schema=../schema.json
id: hardcoded-secret
title: Hardcoded credential
severity: high
cwe: [CWE-798]
category: code
languages: [go, python, javascript, typescript, java, kotlin, rust, csharp, php]
why: Secrets in source end up in every clone, fork, image and log of the repository; rotate any value that was committed.
fix: Load secrets from the environment or a secret store; rotate the exposed value.
references:
  - https://cwe.mitre.org/data/definitions/798.html
examples:
  - language: go
    vulnerable: const apiToken = "s3cr3t-value"
    fixed: |-
      apiToken := os.Getenv("API_TOKEN")
      if apiToken == "" { return errors.New("API_TOKEN not set") }
  - language: python
    vulnerable: DB_PASSWORD = "hunter2-very-secret"
    fixed: DB_PASSWORD = os.environ["DB_PASSWORD"]
  - language: typescript
    vulnerable: const apiKey = 'sk_live_0123456789'
    fixed: const apiKey = process.env.API_KEY ?? throwMissing('API_KEY')
  - language: java
    vulnerable: 'private static final String API_TOKEN = "sk_live_9f8e7d6c5b4a3928";'
    fixed: 'private static final String API_TOKEN = System.getenv("API_TOKEN");'
  - language: rust
    vulnerable: 'const API_TOKEN: &str = "sk_live_9f8e7d6c5b4a3928";'
    fixed: 'let api_token = std::env::var("API_TOKEN")?;'
  - language: csharp
    vulnerable: 'private const string ApiToken = "sk_live_9f8e7d6c5b4a3928";'
    fixed: 'var apiToken = Environment.GetEnvironmentVariable("API_TOKEN");'
  - language: php
    vulnerable: '$apiToken = ''sk_live_9f8e7d6c5b4a3928'';'
    fixed: '$apiToken = getenv(''API_TOKEN'');'
