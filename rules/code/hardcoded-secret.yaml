# yaml-language-server: $schema=../schema.json
id: hardcoded-secret
title: Hardcoded credential
severity: high
cwe: [CWE-798]
category: code
languages: [go, python, javascript, typescript]
why: Secrets in source end up in every clone, fork, image and log of the repository; rotate any value that was committed.
fix: Load secrets from the environment or a secret store; rotate the exposed value.
references:
  - https://cwe.mitre.org/data/definitions/798.html
examples:
  - language: go
    vulnerable: const apiToken = "s3cr3t-value"
    fixed: |-
      apiToken := os.Getenv("API_TOKEN")
      if apiToken == "" { return errors.New("API_TOKEN not set") }
  - language: python
    vulnerable: DB_PASSWORD = "hunter2-very-secret"
    fixed: DB_PASSWORD = os.environ["DB_PASSWORD"]
  - language: typescript
    vulnerable: const apiKey = 'sk_live_0123456789'
    fixed: const apiKey = process.env.API_KEY ?? throwMissing('API_KEY')
