# yaml-language-server: $schema=../schema.json
id: tf-secret-literal
title: Secret written into Terraform code
severity: high
cwe: [CWE-798]
category: config
languages: [terraform]
why: A password or key in a .tf file is in the repository for anyone with read access, and also in the state file and plan output.
fix: Read secrets from a secret manager (data sources for AWS Secrets Manager, Vault, Key Vault) or a sensitive variable set outside the repository, and let the provider generate passwords where it can.
references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://developer.hashicorp.com/terraform/tutorials/configuration-language/sensitive-variables
examples:
  - language: terraform
    vulnerable: |-
      resource "aws_db_instance" "main" {
        password = "do-not-ship-this"
      }
    fixed: |-
      resource "aws_db_instance" "main" {
        manage_master_user_password = true
      }
