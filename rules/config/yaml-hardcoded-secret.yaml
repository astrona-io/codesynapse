# yaml-language-server: $schema=../schema.json
id: yaml-hardcoded-secret
title: Hardcoded credential in YAML
severity: high
cwe: [CWE-798]
category: config
languages: [yaml]
why: Literal credentials in manifests and compose files leak through the repository and every rendered artefact.
fix: Reference a secret or environment variable instead; rotate the value.
references:
  - https://cwe.mitre.org/data/definitions/798.html
examples:
  - language: yaml
    vulnerable: |-
      env:
        - name: DB_PASSWORD
          value: "hunter2-very-secret"
    fixed: |-
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: db-credentials, key: password}
