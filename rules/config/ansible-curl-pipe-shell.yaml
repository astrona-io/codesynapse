# yaml-language-server: $schema=../schema.json
id: ansible-curl-pipe-shell
title: Download piped into a shell in a task
severity: high
cwe: [CWE-494]
category: config
languages: [ansible]
why: "A script fetched with curl or wget and run at once is not checked: a compromised host or a hijacked connection runs code as the task user, often root."
fix: Download with get_url and a checksum, review or pin the file, then run it. Better, use the package manager or a module for the tool.
references:
  - https://docs.ansible.com/ansible/latest/collections/ansible/builtin/get_url_module.html
examples:
  - language: ansible
    vulnerable: |-
      - name: Install tool
        ansible.builtin.shell: curl -sSL https://example.com/install.sh | bash
    fixed: |-
      - name: Fetch installer
        ansible.builtin.get_url:
          url: https://example.com/install.sh
          dest: /usr/local/src/install.sh
          checksum: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          mode: "0750"
