# yaml-language-server: $schema=../schema.json
id: k8s-secret-in-repo
title: Secret manifest with literal data
severity: high
cwe: [CWE-798]
category: config
languages: [yaml]
why: Secret manifests with literal data put credentials in git history forever.
fix: Use a secret manager (External Secrets, SOPS, sealed secrets); rotate the value.
references:
  - https://cwe.mitre.org/data/definitions/798.html
examples:
  - language: yaml
    vulnerable: |-
      kind: Secret
      stringData:
        token: abcdefgh12345
    fixed: |-
      kind: ExternalSecret   # or SealedSecret / SOPS-encrypted file
      spec:
        data:
          - secretKey: token
            remoteRef: {key: app/token}
