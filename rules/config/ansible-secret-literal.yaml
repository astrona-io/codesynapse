# yaml-language-server: $schema=../schema.json
id: ansible-secret-literal
title: Secret written into an Ansible file
severity: high
cwe: [CWE-798]
category: config
languages: [ansible]
why: A password or token in a playbook, vars file or inventory is in the repository for anyone with read access and in every clone and CI log that prints it.
fix: Encrypt the value with ansible-vault (a !vault value or an encrypted vars file), or read it from a secret manager lookup at run time, and set no_log on tasks that handle it.
references:
  - https://docs.ansible.com/ansible/latest/vault_guide/index.html
examples:
  - language: ansible
    vulnerable: |-
      - name: Create database user
        community.mysql.mysql_user:
          name: app
          password: s3cr3t-Passw0rd
    fixed: |-
      - name: Create database user
        community.mysql.mysql_user:
          name: app
          password: "{{ vault_db_password }}"
        no_log: true
