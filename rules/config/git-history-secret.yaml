# yaml-language-server: $schema=../schema.json
id: git-history-secret
title: Credential in git history
severity: high
cwe: [CWE-798]
category: config
languages: [git-history]
why: A credential that was committed stays in every clone and fork of the repository even after the code no longer contains it; anyone with read access can take it from history.
fix: Revoke the credential at its provider and issue a new one; deleting it from the code does not revoke it, and rewriting history only helps once every copy is gone.
references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://docs.github.com/en/code-security/secret-scanning/working-with-secret-scanning-and-push-protection/remediating-a-leaked-secret
examples:
  - language: git-history
    vulnerable: |-
      commit 1: config.go   token := "<a real GitHub token>"
      commit 2: config.go   token := os.Getenv("GITHUB_TOKEN")
    fixed: |-
      Revoke the old token on GitHub, create a new one in the secret store,
      and keep reading it from the environment as commit 2 does.
