# yaml-language-server: $schema=../schema.json
id: dockerfile-secret-in-env
title: Secret written into the image with ENV or ARG
severity: high
cwe: [CWE-798]
category: config
languages: [dockerfile]
why: ENV values are stored in the image and ARG values in its history; anyone who can pull the image can read the secret, and it sits in the repository too.
fix: Pass secrets at build time with RUN --mount=type=secret and at run time through the orchestrator's secrets; never as ENV or ARG values.
references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://docs.docker.com/build/building/secrets/
examples:
  - language: dockerfile
    vulnerable: |-
      ENV API_TOKEN=do-not-ship-this
      RUN ./fetch-deps.sh
    fixed: RUN --mount=type=secret,id=api_token API_TOKEN=$(cat /run/secrets/api_token) ./fetch-deps.sh
